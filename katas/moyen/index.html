<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katas moyens - KATA JS</title>
    <link rel="stylesheet" href="../../picker/styles.css">
  </head>
  <body>
    <div data-site-nav data-root="../.." data-title="Katas moyens" data-active="moyen"></div>

    <main class="home-layout">
      <section class="kata-gallery" aria-label="Katas moyens">
        <article class="kata-card level-moyen">
          <a class="kata-preview" href="yeux-souris/index.html" aria-label="Ouvrir le kata Yeux qui suivent la souris">
            <iframe src="yeux-souris/starter/index.html" title="Apercu du kata Yeux qui suivent la souris" tabindex="-1" scrolling="no"></iframe>
          </a>
          <div class="kata-card-content">
            <span class="level-tag">Moyen</span>
            <h2>Yeux qui suivent la souris</h2>
            <p>Utiliser la position de la souris pour orienter deux pupilles.</p>
            <div data-kata-progress-summary="yeux-souris"></div>
            <a class="button" href="yeux-souris/index.html">Ouvrir le kata</a>
          </div>
        </article>
      </section>
    </main>
    <script src="../../shared/kata-progress.js"></script>
    <script src="../../shared/site-nav.js"></script>
  </body>
</html>
