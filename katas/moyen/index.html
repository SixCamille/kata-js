<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katas moyens - KATA JS</title>
    <link rel="stylesheet" href="../../picker/styles.css">
  </head>
  <body>
    <div data-site-nav data-root="../.." data-title="Katas moyens" data-active="moyen"></div>

    <main class="home-layout">
      <section class="kata-gallery" data-level-gallery="moyen" aria-label="Katas moyens"></section>
    </main>
    <script src="../../picker/data.js"></script>
    <script src="../../shared/kata-progress.js"></script>
    <script src="../../shared/kata-cards.js"></script>
    <script>
      const gallery = document.querySelector("[data-level-gallery]");
      const level = gallery.dataset.levelGallery;

      KATAS.filter(function (kata) {
        return kata.level === level;
      }).forEach(function (kata) {
        gallery.append(KataCards.createKataCard(kata, { root: "../.." }));
      });
    </script>
    <script src="../../shared/site-nav.js"></script>
  </body>
</html>
