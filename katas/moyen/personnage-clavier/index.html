<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kata - Personnage au clavier</title>
    <link rel="stylesheet" href="../../../shared/starter-shell.css">
  </head>
  <body class="level-moyen" data-kata="personnage-clavier">
    <div data-site-nav data-root="../../.." data-title="KATA JS" data-active="moyen"></div>

    <div class="starter-layout">
      <main class="playground-zone">
        <iframe class="playground-frame" src="starter/index.html" title="Playground du kata personnage clavier"></iframe>
      </main>

      <aside class="kata-brief" aria-labelledby="brief-title">
        <div class="brief-content">
          <p class="level-tag">Kata difficile</p>
          <h2 id="brief-title">Personnage au clavier</h2>
          <p>Les flèches du clavier doivent déplacer le personnage sans le laisser sortir.</p>

          <h3>Attendu</h3>
          <ul>
            <li>Ecouter les touches du clavier.</li>
            <li>Modifier les coordonnées du personnage.</li>
            <li>Limiter la position aux bords de l'arène.</li>
          </ul>

          <hr>
          <section class="kata-timer" data-kata-timer aria-label="Suivi du kata"></section>

          <hr>
          <div class="brief-actions">
            <button class="memo-button" type="button" data-open-memo>Ouvrir le mémo</button>
            <a class="memo-button" href="starter/index.html" target="_blank" rel="noopener noreferrer">Ouvrir le playground</a>
          </div>
        </div>
      </aside>
    </div>

    <script src="../../../shared/site-nav.js"></script>
    <script src="../../../shared/kata-memo.js"></script>
    <script src="../../../shared/kata-progress.js"></script>
  </body>
</html>
