<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Toasts empilés</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="panel">
      <h1>Notifications</h1>
      <p>Chaque clic doit ajouter un toast dans la pile.</p>
      <button type="button">Nouvelle notification</button>
    </main>
    <aside class="toasts" aria-live="polite">
      <article class="toast">
        <strong>Notification exemple</strong>
        <span>Ton script doit créer des toasts comme celui-ci.</span>
      </article>
    </aside>
    <script src="script.js"></script>
  </body>
</html>
