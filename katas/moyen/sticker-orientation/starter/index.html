<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Sticker emoji orienté</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="stage" aria-label="Zone de stickers">
      <p>Clique dans cette zone pour coller des stickers de tailles et d'orientations variees.</p>
      <div class="sticker demo-sticker sticker-star" aria-label="Sticker etoile">⭐</div>
      <div class="sticker demo-sticker sticker-fire" aria-label="Sticker feu">🔥</div>
      <div class="sticker demo-sticker sticker-target" aria-label="Sticker cible">🎯</div>
      <div class="sticker demo-sticker sticker-light" aria-label="Sticker idee">💡</div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
