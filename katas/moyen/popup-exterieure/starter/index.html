<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Popup extérieure</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Popup extérieure</h1>
      <p class="intro">La modale s'ouvre avec le bouton et se ferme quand on clique sur le fond.</p>
      <button class="open-modal" type="button">Ouvrir</button>
      <div class="modal">
        <section class="modal-box">
          <button class="close-modal" type="button">x</button>
          <h2>Modale</h2>
          <p>Un clic sur le fond doit fermer cette fenêtre.</p>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
