<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Filtre produits</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Filtre produits</h1>
      <p class="intro">Les boutons de catégorie doivent afficher uniquement les produits concernés.</p>
      <div class="filters">
        <button type="button" data-filter="all">Tous</button>
        <button type="button" data-filter="fruit">Fruits</button>
        <button type="button" data-filter="drink">Boissons</button>
      </div>
      <ul class="products"></ul>
    </main>
    <script src="script.js"></script>
  </body>
</html>
