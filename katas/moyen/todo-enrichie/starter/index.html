<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Todo enrichie</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Todo enrichie</h1>
      <p class="intro">La liste doit gérer l'ajout, la validation, la suppression et le nombre de tâches restantes.</p>
      <form class="todo-form">
        <input type="text" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche">
        <button type="submit">Ajouter</button>
      </form>
      <ul class="todo-list"></ul>
      <p class="status"><span>0</span> tâche restante</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
