<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Fond lié au scroll</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <p class="eyebrow">Scroll progressif</p>
      <h1>Fond lié au scroll</h1>
      <p class="intro">Le fond doit changer progressivement quand on descend dans la page.</p>
      <div class="color-samples" aria-label="Exemples de couleurs utilisables">
        <span class="color-chip color-chip--start">Début : #f8fafc</span>
        <span class="color-chip color-chip--middle">Milieu : #38bdf8</span>
        <span class="color-chip color-chip--end">Fin : #312e81</span>
      </div>
      <div class="scroll-page">
        <p class="meter">Scroll : <span>0</span>%</p>
        <section>
          <span>Début</span>
        </section>
        <section>
          <span>Milieu</span>
        </section>
        <section>
          <span>Fin</span>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
