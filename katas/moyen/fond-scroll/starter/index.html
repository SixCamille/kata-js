<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Fond lié au scroll</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <p class="eyebrow">Scroll progressif</p>
      <h1>Fond lié au scroll</h1>
      <p class="intro">Le fond doit changer progressivement quand on descend dans la page.</p>
      <div class="gradient-guide" aria-label="Exemple de dégradé de couleurs">
        <p class="guide-title">Exemple de couleurs pour le fond</p>
        <div class="gradient-preview" aria-hidden="true"></div>
        <div class="color-samples">
          <span class="color-chip color-chip--start">0% : #f8fafc</span>
          <span class="color-chip color-chip--middle">50% : #38bdf8</span>
          <span class="color-chip color-chip--end">100% : #312e81</span>
        </div>
      </div>
      <div class="scroll-page">
        <p class="meter">Scroll : <span>0</span>%</p>
        <section>
          <span>Début</span>
        </section>
        <section>
          <span>Milieu</span>
        </section>
        <section>
          <span>Fin</span>
        </section>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
