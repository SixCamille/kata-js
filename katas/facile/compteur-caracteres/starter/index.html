<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Compteur de caractères</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Compteur de caractères</h1>
      <p class="intro">Le compteur doit suivre la longueur du texte pendant la saisie.</p>
      <textarea maxlength="120" placeholder="Votre message"></textarea>
      <p class="status"><span class="count">0</span> / 120 caractères</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
