<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kata - Mot de passe</title>
    <link rel="stylesheet" href="../../../shared/starter-shell.css">
  </head>
  <body class="level-facile" data-kata="mot-de-passe">
    <div data-site-nav data-root="../../.." data-title="KATA JS" data-active="facile"></div>

    <div class="starter-layout">
      <main class="playground-zone">
        <iframe class="playground-frame" src="starter/index.html" title="Playground du kata mot de passe"></iframe>
      </main>

      <aside class="kata-brief" aria-labelledby="brief-title">
        <div class="brief-content">
          <p class="level-tag">Kata facile</p>
          <h2 id="brief-title">Afficher / masquer</h2>
          <p>Au clic, le bouton doit alterner entre l'affichage et le masquage du mot de passe.</p>

          <h3>Attendu</h3>
          <ul>
            <li>Changer le type de l'input entre <code>password</code> et <code>text</code>.</li>
            <li>Mettre à jour le texte du bouton.</li>
            <li>Mémoriser l'état avec un booléen.</li>
          </ul>

          <hr>
          <section class="kata-timer" data-kata-timer aria-label="Suivi du kata"></section>

          <hr>
          <div class="brief-actions">
            <button class="memo-button" type="button" data-open-memo>Ouvrir le mémo</button>
            <a class="memo-button" href="starter/index.html" target="_blank" rel="noopener noreferrer">Ouvrir le playground</a>
          </div>
        </div>
      </aside>
    </div>

    <script src="../../../shared/site-nav.js"></script>
    <script src="../../../shared/kata-memo.js"></script>
    <script src="../../../shared/kata-progress.js"></script>
  </body>
</html>
