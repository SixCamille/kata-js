<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Popup simple</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Annonce</h1>
      <button class="open-modal" type="button">Ouvrir la popup</button>
    </main>

    <section class="modal" aria-label="Popup d'information">
      <div class="modal-box">
        <button class="close-modal" type="button" aria-label="Fermer">x</button>
        <h2>Bravo</h2>
        <p>La popup est visible. Il faut maintenant pouvoir la fermer.</p>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
