<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Image qui flip</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <button class="card" type="button" aria-label="Alterner le recto et le verso">
        <span class="front">
          <span class="card-kicker">Recto</span>
        </span>
        <span class="back">
          <span class="card-kicker">Verso</span>
        </span>
      </button>
      <p>Clique sur la carte pour alterner recto et verso.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
