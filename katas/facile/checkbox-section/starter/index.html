<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Afficher selon une checkbox</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Afficher selon une checkbox</h1>
      <p class="intro">La section optionnelle doit apparaître uniquement quand la case est cochée.</p>
      <label class="check-line">
        <input type="checkbox">
        Afficher les options avancées
      </label>
      <section class="extra-panel">
        <h2>Options avancées</h2>
        <p>Cette zone ne doit apparaître que si la case est cochée.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
