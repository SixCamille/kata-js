<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Barre de progression</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="panel">
      <h1>Installation</h1>
      <div class="progress" aria-label="Progression">
        <div class="bar"></div>
      </div>
      <p class="percent">0%</p>
      <div class="actions">
        <button class="back" type="button">Reculer</button>
        <button class="next" type="button">Avancer</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
