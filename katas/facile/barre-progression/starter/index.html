<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Barre de progression</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Téléchargement</p>
      <h1>Progression automatique</h1>
      <div class="progress" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar"></div>
      </div>
      <p class="percent">0%</p>
      <div class="actions">
        <button class="reset" type="button">Remettre à 0</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
