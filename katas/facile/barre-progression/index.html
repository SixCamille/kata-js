<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kata - Barre de progression</title>
    <link rel="stylesheet" href="../../../shared/starter-shell.css">
  </head>
  <body class="level-facile" data-kata="barre-progression">
    <div data-site-nav data-root="../../.." data-title="KATA JS" data-active="facile"></div>
    <div class="starter-layout">
      <main class="playground-zone">
        <iframe class="playground-frame" src="starter/index.html" title="Playground du kata barre de progression"></iframe>
      </main>
      <aside class="kata-brief" aria-labelledby="brief-title">
        <div class="brief-content">
          <p class="level-tag">Kata facile</p>
          <h2 id="brief-title">Barre de progression</h2>
          <p>Deux boutons doivent faire avancer ou reculer une barre par etapes de 10%.</p>
          <h3>Attendu</h3>
          <ul>
            <li>Stocker la progression dans une variable.</li>
            <li>Limiter la valeur entre 0 et 100.</li>
            <li>Modifier la largeur de la barre.</li>
            <li>Afficher le pourcentage courant.</li>
          </ul>
          <hr>
          <section class="kata-timer" data-kata-timer aria-label="Suivi du kata"></section>
          <hr>
          <div class="brief-actions">
            <button class="memo-button" type="button" data-open-memo>Ouvrir le memo</button>
            <a class="memo-button" href="starter/index.html" target="_blank" rel="noopener noreferrer">Ouvrir le playground</a>
          </div>
        </div>
      </aside>
    </div>
    <script src="../../../shared/site-nav.js"></script>
    <script src="../../../shared/kata-memo.js"></script>
    <script src="../../../shared/kata-progress.js"></script>
  </body>
</html>
