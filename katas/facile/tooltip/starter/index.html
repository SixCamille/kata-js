<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Tooltip</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <section class="hero-card" aria-labelledby="kata-title">
        <p class="eyebrow">Interaction courte</p>
        <h1 id="kata-title">Tooltip</h1>
        <p class="intro">Le texte d'aide doit apparaître au survol ou au focus du badge, puis disparaître quand il n'est plus actif.</p>
      </section>

      <section class="tooltip-board" aria-label="Zone de travail">
        <article class="demo-card">
          <div class="tooltip-zone">
            <button class="info-button" type="button" aria-describedby="tooltip-text">?</button>
            <p class="tooltip is-visible" id="tooltip-text" role="tooltip">Une variable stocke une valeur réutilisable.</p>
          </div>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
