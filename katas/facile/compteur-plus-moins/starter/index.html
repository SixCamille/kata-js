<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Compteur plus moins</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="counter-card">
      <h1>Participants</h1>
      <p class="value">0</p>
      <div class="actions">
        <button class="minus" type="button">-</button>
        <button class="plus" type="button">+</button>
      </div>
      <p class="hint">La valeur ne doit jamais devenir negative.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
