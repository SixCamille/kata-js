<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Horloge analogique</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Horloge analogique</h1>
      <p class="intro">Les aiguilles doivent tourner selon les heures, minutes et secondes actuelles.</p>
      <section class="clock" aria-label="Horloge analogique">
        <div class="ticks" aria-hidden="true">
          <span style="--i: 0"></span>
          <span style="--i: 1"></span>
          <span style="--i: 2"></span>
          <span style="--i: 3"></span>
          <span style="--i: 4"></span>
          <span style="--i: 5"></span>
          <span style="--i: 6"></span>
          <span style="--i: 7"></span>
          <span style="--i: 8"></span>
          <span style="--i: 9"></span>
          <span style="--i: 10"></span>
          <span style="--i: 11"></span>
        </div>
        <span class="number twelve">12</span>
        <span class="number three">3</span>
        <span class="number six">6</span>
        <span class="number nine">9</span>
        <span class="hand hour"></span>
        <span class="hand minute"></span>
        <span class="hand second"></span>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
