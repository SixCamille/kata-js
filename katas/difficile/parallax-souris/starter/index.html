<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Parallax souris</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Parallax souris</h1>
      <p class="intro">Déplacez les trois couches selon la position de la souris : plus le pointeur s'éloigne du centre de la fenêtre, plus le soleil, les montagnes et la branche se décalent avec leur propre vitesse.</p>
      <section class="parallax">
        <div class="layer sun" data-speed="0.03"></div>
        <div class="layer mountains" data-speed="0.055">
          <img src="montagnes-papier.png" alt="">
        </div>
        <div class="layer branch" data-speed="0.1">
          <img src="branche-cerisier.png" alt="">
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
