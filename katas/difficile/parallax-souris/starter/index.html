<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Parallax souris</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Parallax souris</h1>
      <p class="intro">Les couches doivent bouger légèrement dans des directions et vitesses différentes.</p>
      <section class="parallax">
        <div class="layer back" data-speed="0.03"></div>
        <div class="layer middle" data-speed="0.06"></div>
        <div class="layer front" data-speed="0.1"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
