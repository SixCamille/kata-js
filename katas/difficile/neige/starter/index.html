<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Neige</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="sky">
      <h1>Neige dans la fenêtre</h1>
      <div class="snow-sample" aria-label="Exemples de flocons textuels de tailles différentes">
        <span class="flake-sample tiny">.</span>
        <span class="flake-sample small">*</span>
        <span class="flake-sample medium">+</span>
        <span class="flake-sample large">.</span>
        <span class="flake-sample tiny">*</span>
        <span class="flake-sample medium">+</span>
        <span class="flake-sample small">.</span>
        <span class="flake-sample large">*</span>
      </div>
      <span class="flake flake-frozen" style="left:12%;top:18%">.</span>
      <span class="flake flake-frozen" style="left:35%;top:45%">*</span>
      <span class="flake flake-frozen" style="left:62%;top:28%">+</span>
      <span class="flake flake-frozen" style="left:80%;top:60%">.</span>
      <span class="flake flake-frozen" style="left:22%;top:75%">*</span>
      <span class="flake flake-frozen" style="left:50%;top:12%">+</span>
      <span class="flake flake-frozen" style="left:72%;top:80%">.</span>
      <span class="flake flake-frozen" style="left:45%;top:55%">*</span>
    </main>
    <script src="script.js"></script>
  </body>
</html>
