<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Parallax scroll</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <section class="intro-panel">
        <p class="eyebrow">Kata JS</p>
        <h1>Parallax scroll</h1>
        <p>Faites défiler la page : chaque couche de la fresque doit se déplacer avec son propre facteur de vitesse.</p>
      </section>

      <section class="hero-parallax" aria-label="Scène parallax inspirée de la Création d'Adam">
        <div class="layer aura aura-back" data-speed="-0.05"></div>
        <div class="layer aura aura-front" data-speed="0.08"></div>
        <img class="layer adam" src="adam-clair-obscur.png" alt="Adam allongé, le bras tendu" data-speed="0.02">
        <img class="layer dieu" src="dieu-cherubins.png" alt="Dieu volant entouré de chérubins, le bras tendu" data-speed="0.24">
        <div class="touch-line" aria-hidden="true"></div>
      </section>

      <section class="content">
        <p>Objectif : relier le scroll aux déplacements verticaux des couches.</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
