<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kata - Chronometre todo</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <section class="timer">
        <p class="label">Temps ecoule</p>
        <strong class="time">00:00</strong>
        <button class="timer-button" type="button">Demarrer</button>
      </section>

      <section class="tasks">
        <h1>Todo de session</h1>
        <form>
          <input name="task" type="text" placeholder="Nouvelle tache">
          <button type="submit">Ajouter</button>
        </form>
        <p class="counter">0 tache terminee</p>
        <ul></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
