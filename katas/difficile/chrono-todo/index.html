<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kata - Chronometre todo</title>
    <link rel="stylesheet" href="../../../shared/starter-shell.css">
  </head>
  <body class="level-difficile" data-kata="chrono-todo">
    <div data-site-nav data-root="../../.." data-title="KATA JS" data-active="difficile"></div>

    <div class="starter-layout">
      <main class="playground-zone">
        <iframe class="playground-frame" src="starter/index.html" title="Playground du kata chrono todo"></iframe>
      </main>

      <aside class="kata-brief" aria-labelledby="brief-title">
        <div class="brief-content">
          <p class="level-tag">Kata difficile</p>
          <h2 id="brief-title">Chrono + todo</h2>
          <p>Construire deux petits etats qui cooperent : le temps ecoule et la liste des taches.</p>

          <h3>Attendu</h3>
          <ul>
            <li>Demarrer et mettre en pause le chronometre.</li>
            <li>Ajouter des taches via le <code>submit</code>.</li>
            <li>Stocker les taches dans un tableau et refaire le rendu.</li>
          </ul>

          <hr>
          <section class="kata-timer" data-kata-timer aria-label="Suivi du kata"></section>

          <hr>
          <div class="brief-actions">
            <button class="memo-button" type="button" data-open-memo>Ouvrir le memo</button>
            <a class="memo-button" href="starter/index.html" target="_blank" rel="noopener noreferrer">Ouvrir le playground</a>
          </div>
        </div>
      </aside>
    </div>

    <script src="../../../shared/site-nav.js"></script>
    <script src="../../../shared/kata-memo.js"></script>
    <script src="../../../shared/kata-progress.js"></script>
  </body>
</html>
