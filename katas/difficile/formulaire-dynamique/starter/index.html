<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Formulaire dynamique</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Formulaire dynamique</h1>
      <p class="intro">Le formulaire doit permettre d'ajouter plusieurs participants puis d'en supprimer.</p>
      <button class="add-person" type="button">Ajouter un participant</button>
      <form class="dynamic-form">
        <div class="participants"></div>
      </form>
      <p class="status"><span>0</span> participant</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
