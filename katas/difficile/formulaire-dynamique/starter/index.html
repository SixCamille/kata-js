<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Formulaire dynamique</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <section class="form-panel" aria-labelledby="form-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Atelier inscription</p>
            <h1 id="form-title">Formulaire dynamique</h1>
          </div>
          <p class="status" aria-live="polite"><span>1</span> participant</p>
        </div>

        <p class="intro">Ajoutez des participants avec un prénom, un nom et un aperçu lisible des informations saisies.</p>

        <button class="add-person" type="button">Ajouter un participant</button>

        <form class="dynamic-form">
          <div class="participants" aria-label="Liste des participants">
            <article class="participant">
              <div class="participant-fields">
                <label>
                  Prénom
                  <input type="text" value="Ada">
                </label>
                <label>
                  Nom
                  <input type="text" value="Lovelace">
                </label>
              </div>
              <div class="participant-summary" aria-label="Aperçu du participant">
                <p>Aperçu</p>
                <strong>Ada Lovelace</strong>
              </div>
              <button class="remove-person" type="button">Supprimer</button>
            </article>
          </div>
          <p class="empty-state">Aucun participant pour le moment.</p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
