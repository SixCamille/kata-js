<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Command palette</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Command palette</h1>
      <p class="intro">La palette doit s'ouvrir au clavier, filtrer les commandes et valider la sélection.</p>
      <p class="hint">Appuie sur Ctrl + K pour ouvrir la palette.</p>
      <section class="palette">
        <input type="search" placeholder="Chercher..." aria-label="Commande">
        <ul class="commands"></ul>
      </section>
      <p class="status">Aucune commande lancée.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
