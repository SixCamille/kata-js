<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Terminal fictif</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="terminal">
      <section class="screen" aria-live="polite">
        <p class="line muted">Commandes possibles : aide, date, clear.</p>
      </section>
      <form>
        <span aria-hidden="true">&gt;</span>
        <input type="text" aria-label="Commande" autocomplete="off">
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
