<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Drag drop zones</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="board">
      <div class="card" draggable="true">JS</div>
      <section class="zones">
        <div class="drop-zone" data-accept="false">Zone HTML</div>
        <div class="drop-zone" data-accept="true">Zone JavaScript</div>
      </section>
      <p class="message">Depose la carte dans la bonne zone.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
