<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Comparateur d'images enrichi</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Comparateur d'images enrichi</h1>
      <p class="intro">Le séparateur doit révéler plus ou moins l'image après, sans sortir du cadre.</p>
      <section class="compare">
        <div class="image before">Avant</div>
        <div class="image after">Après</div>
        <button class="handle" type="button" aria-label="Déplacer le comparateur"></button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
