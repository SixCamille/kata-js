<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground - Puzzle réordonnable</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="kata-stage">
      <h1>Puzzle réordonnable</h1>
      <p class="intro">Les pièces doivent pouvoir être réordonnées et le message doit indiquer quand l'ordre est correct.</p>
      <ul class="puzzle">
        <li draggable="true" data-order="2">2</li>
        <li draggable="true" data-order="1">1</li>
        <li draggable="true" data-order="4">4</li>
        <li draggable="true" data-order="3">3</li>
      </ul>
      <p class="status">Réordonne les pièces.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
