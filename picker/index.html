<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picker - KATA JS</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Picker de kata</h1>
      </div>
      <nav class="topnav" aria-label="Navigation principale">
        <a href="../index.html">Accueil</a>
        <a href="../katas/facile/index.html">Facile</a>
        <a href="../katas/moyen/index.html">Moyen</a>
        <a href="../katas/difficile/index.html">Difficile</a>
        <a href="../pense-bete/javascript.html">Pense-bete</a>
        <a class="active-nav" href="index.html">Picker</a>
      </nav>
    </header>

    <main class="picker-layout">
      <section class="controls" aria-labelledby="level-title">
        <p class="eyebrow">Evaluation 20 minutes</p>
        <h2 id="level-title">Filtrer les katas</h2>
        <div class="segmented" role="group" aria-label="Niveau du kata">
          <button class="level-button active" type="button" data-level="tous">Tous niveaux</button>
          <button class="level-button" type="button" data-level="facile">Facile</button>
          <button class="level-button" type="button" data-level="moyen">Moyen</button>
          <button class="level-button" type="button" data-level="difficile">Difficile</button>
        </div>
        <button class="button primary draw-button" type="button">Tirer un kata</button>
      </section>

      <section class="picker-result" id="kata-result" aria-live="polite" aria-label="Kata tire au sort"></section>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
